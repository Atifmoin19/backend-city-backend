# Render's free plan sleeps after 15 minutes without traffic; the next visitor then waits
# 30-60 s. Ping /health (no DB call) every 10 minutes so the API stays awake.
# One always-on free service uses ~744 of the 750 free instance hours per month.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it
# under Actions if pings stop. Set the repository variable API_HEALTH_URL to override.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.API_HEALTH_URL || 'https://backend-city-api.onrender.com/health' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$URL"
