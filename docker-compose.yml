# Local development: Postgres + API with hot reload.
#   docker compose up --build
name: backend-city
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: backend_city
      POSTGRES_PASSWORD: backend_city
      POSTGRES_DB: backend_city
    ports:
      - "5452:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_city"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://backend_city:backend_city@db:5432/backend_city
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./harness:/app/harness
      - ./alembic:/app/alembic
      - ./content:/app/content
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
